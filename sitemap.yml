name: Auto-generate sitemap

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
  workflow_dispatch: {}
  schedule:
    # Refresh the <lastmod> dates weekly even if no content changed
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate sitemap.xml
        run: node scripts/generate-sitemap.js

      - name: Commit updated sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "chore: auto-update sitemap.xml [skip ci]"
          git push
